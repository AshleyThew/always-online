plugins {
    id 'java'
        id 'com.gradleup.shadow'
}

import org.apache.tools.ant.filters.ReplaceTokens

configurations {
    mysqlDriver {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation project(':common')
    implementation project(':1_14_plus')
    implementation project(':1_16_4_plus')
    implementation project(':1_20_2_plus')
    implementation project(':26_1_plus')

    compileOnly 'org.spigotmc:spigot:1.14-R0.1-SNAPSHOT'
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.3-SNAPSHOT'
    compileOnly 'net.md-5:bungeecord-proxy:1.20-R0.3-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.0.1'

    mysqlDriver('com.mysql:mysql-connector-j:8.0.33') {
        transitive = false
    }
}

task copyEmbeddedMysqlDriver(type: Copy) {
    from configurations.mysqlDriver
    into layout.buildDirectory.dir('generated-resources/mysql-libs')
}

processResources {
    dependsOn copyEmbeddedMysqlDriver
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Don't include generated-resources here to avoid shadowJar unpacking the jar
    with copySpec {
        from 'src/main/resources'
        filter ReplaceTokens, tokens: [
                'version': version
        ]
    }
}

// Process Java sources to replace version tokens
task processJava(type: Copy) {
    from 'src/main/java'
    into 'build/generated-src'
    filter ReplaceTokens, tokens: [
            'version': version
    ]
}

// Make compileJava depend on processJava and use the processed sources
compileJava {
    dependsOn processJava
    source = 'build/generated-src'
}

shadowJar {
    archiveClassifier = 'shadow'
    relocate 'me.dablakbandit.annotateconfig', 'me.dablakbandit.ao.libs.annotateconfig'
    relocate 'org.yaml.snakeyaml', 'me.dablakbandit.ao.libs.snakeyaml'
}

task finalJar(type: Zip) {
    dependsOn shadowJar, copyEmbeddedMysqlDriver

    from(zipTree(shadowJar.archiveFile))
    from(configurations.mysqlDriver) {
        into 'lib'
    }

    archiveExtension = 'jar'
    destinationDirectory = file("$projectDir/target")
    archiveFileName = "${project.name}-${project.version}-shaded.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task copyToOutput(type: Copy, dependsOn: finalJar) {
    from finalJar.archiveFile
    into "$rootDir/output"
    rename(finalJar.archiveFileName.get(), "${rootProject.name}-latest.jar")
}

build.finalizedBy copyToOutput