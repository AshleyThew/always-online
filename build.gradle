plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5' apply false
}

ext {
    plVersion = '6.3.5'
}

allprojects {
    group = 'me.dablakbandit'
    version = plVersion

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
        maven { url = 'https://ci.lucko.me/plugin/repository/everything/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://jitpack.io' }
        maven { url "https://repo.spongepowered.org/repository/maven-public" }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // compileOnly server/library jars may declare newer JVM requirements
        // in their module metadata; don't let that fail resolution.
        disableAutoTargetJvm()
    }

    compileJava {
        options.encoding = 'UTF-8'
    }

    ext {
        bukkitVersion = '1.14-R0.1-SNAPSHOT'
        aoVersion = plVersion
    }
}