#Welcome to the AlwaysOnline main configuration file!
#The delay to wait between checking to see if mojang is online, in seconds.
check-interval=60
#Message for the MOTD to be when mojang servers are offline. Set to 'null' to disable.
message-motd-offline=&eMojang servers are down,\n&ebut you can still connect!
#The message to display when a user attempts to login while the mojang servers are offline, but their IP does not match.
message-kick-ip=We can not let you join since you are not on the same computer you logged on before!
#The message to display when a user is new and logs in while mojang servers are offline.
message-kick-new=We can not let you join because the mojang servers are offline!
#The message to display when a user attempts to login with an invalid minecraft username.
message-kick-invalid=Invalid username. Hacking?
#The message to display when mojang servers go offline. Set to null to disable.
message-mojang-offline=&5[&2AlwaysOnline&5]&a Mojang servers are now offline!
#The message to display when mojang servers go back online. Set to null to disable.
message-mojang-online=&5[&2AlwaysOnline&5]&a Mojang servers are now online!
#Below are three session server check methods which can be used to determine if mojang is online or not.
#For example, if http-head-session-server is true AND mojang-server-status is also true, then the plugin will
#only go into mojang offline mode if both services claim the session servers are offline.
#Uses the status information located at https://sessionserver.mojang.com/
http-head-session-server=true
#The lockout duration in minutes when the down detector triggers.
#If the server is detected as down again during this period, the lockout timer resets.
down-detector-lockout-minutes=5
##########################################
#    Status Change Notifications
#    Sent when mojang servers go offline or come back online.
#    Every method below is optional and disabled until configured.
##########################################
#The message sent by the notification methods below (discord has its own messages). Set to null to disable one direction.
notify-message-offline=Mojang servers are now offline! Falling back to AlwaysOnline authentication.
notify-message-online=Mojang servers are back online! Normal authentication restored.
#Discord webhook URL to notify when mojang servers go offline or come back online.
#Create one in your Discord server: Channel Settings -> Integrations -> Webhooks. Leave empty to disable.
discord-webhook-url=
#The username the discord webhook posts as.
discord-webhook-username=AlwaysOnline
#The message sent to discord when mojang servers go offline. Set to null to disable.
discord-webhook-message-offline=Mojang servers are now offline! Falling back to AlwaysOnline authentication.
#The message sent to discord when mojang servers come back online. Set to null to disable.
discord-webhook-message-online=Mojang servers are back online! Normal authentication restored.
#Generic webhook. POSTs {"plugin":"AlwaysOnline","status":"offline|online","message":"...","timestamp":"..."} as JSON to this URL.
#Works with Slack-compatible endpoints, n8n, Zapier, home automation, custom dashboards etc. Leave empty to disable.
notify-webhook-url=
#Telegram bot notifications. Create a bot with @BotFather to get a token, and use @userinfobot to find your chat id.
#Leave either empty to disable.
telegram-bot-token=
telegram-chat-id=
#ntfy push notifications. Full topic URL, e.g. https://ntfy.sh/your-secret-topic. Leave empty to disable.
ntfy-url=
#Optional access token if your ntfy topic is protected.
ntfy-token=
#Pushover notifications. Requires an application token and your user key. Leave either empty to disable.
pushover-token=
pushover-user=
#Gotify notifications. Server base URL, e.g. https://gotify.example.com, and an application token. Leave either empty to disable.
gotify-url=
gotify-token=
#Console commands to run when the status changes, without a leading slash. Leave empty to disable.
notify-command-offline=
notify-command-online=
##########################################
#    Mysql Database Information
#    Only edit if using mysql
##########################################
use_mysql=false
host=127.0.0.1
port=3306
database-name=minecraft
database-username=root
database-password=password
database-extra=
##########################################
#    MongoDB Database Information
#    Only edit if using mongodb
##########################################
use_mongodb=false
mongo-host=127.0.0.1
mongo-port=27017
mongo-database=minecraft
mongo-username=
mongo-password=
mongo-connection-string=
#Please do not change this!
config_version=7